name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
  schedule:
    # Jalankan tiap 15 menit untuk sinkronisasi data dari Google Sheets
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      message:
        description: 'Pesan untuk trigger manual'
        required: false
        default: 'Manual sync & deploy'

# Izin workflow untuk menulis ke repo dan deploy pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest data from Google Sheets
        env:
          SHEET_ID: ${{ vars.SHEET_ID || '1TZiQfgiVXmXCLorD1BePuH2wEDnUcy_zWTivQSE3fUk' }}
          SHEET_NAME: ${{ vars.SHEET_NAME || 'Response' }}
        run: |
          node scripts/fetch-data.js
          echo "=== data.meta.json ==="
          cat data.meta.json || true

      - name: Commit & push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data, skip commit."
          else
            git commit -m "chore(sync): update data.json from Google Sheets - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
